<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/csm-brutalist-design-system-f9ab70a7-c457-4599-9430-8b9c30195c23/tokens/colors.css">
  <link rel="stylesheet" href="_ds/csm-brutalist-design-system-f9ab70a7-c457-4599-9430-8b9c30195c23/tokens/typography.css">
  <link rel="stylesheet" href="_ds/csm-brutalist-design-system-f9ab70a7-c457-4599-9430-8b9c30195c23/tokens/spacing_and_shape.css">
  <link rel="stylesheet" href="_ds/csm-brutalist-design-system-f9ab70a7-c457-4599-9430-8b9c30195c23/styles.css">
  <script src="_ds/csm-brutalist-design-system-f9ab70a7-c457-4599-9430-8b9c30195c23/_ds_bundle.js"></script>
  <style>
    body{margin:0;background:#DAD7CE;font-family:'Space Grotesk',system-ui,sans-serif}
    a{color:#241B6B}
    a:hover{color:#16151B}
    @media (max-width:799px){
      .cs-hdr{grid-template-columns:auto 1fr !important}
      .cs-hdr-cities{display:none !important}
      .cs-meta{grid-template-columns:1fr !important}
      .cs-meta > div{border-right:none !important}
      .cs-meta > div:not(:last-child){border-bottom:2px solid #16151B !important}
    }
  </style>
</helmet>

<div style="max-width:1280px;margin:0 auto;background:#F2F0EA;color:#16151B;min-height:100vh;border-left:3px solid #16151B;border-right:3px solid #16151B;display:flex;flex-direction:column">

  <div class="cs-hdr" style="display:grid;grid-template-columns:auto 1fr auto;border-bottom:3px solid #16151B">
    <div style="padding:14px 20px;border-right:3px solid #16151B;display:flex;align-items:center"><img src="./assets/diamond-indigo.png" alt="CSM" style="width:34px;height:34px"></div>
    <div style="padding:14px 20px;display:flex;align-items:center;font-family:'Archivo Black',sans-serif;font-size:16px;letter-spacing:-.01em;min-width:0">CENTER FOR SUSTAINABLE MEDIA</div>
    <div class="cs-hdr-cities" style="padding:14px 20px;border-left:3px solid #16151B;display:flex;align-items:center;font-size:13px;font-weight:500">BUDAPEST—VIENNA—BRUSSELS</div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(56px,9vw,128px) clamp(20px,3vw,40px) clamp(48px,7vw,96px);border-bottom:3px solid #16151B">
    <h1 style="margin:0;font-family:'Archivo Black',sans-serif;font-size:clamp(40px,7vw,96px);line-height:.96;letter-spacing:-.02em;text-transform:uppercase;max-width:13ch;text-wrap:balance"><span style="position:relative;z-index:1">Capital Stacks of</span> <span style="background:#241B6B;color:#fff;padding:.05em .13em .02em;box-decoration-break:clone;-webkit-box-decoration-break:clone"><span style="position:relative;z-index:1">Journalism</span></span></h1>
    <p style="margin:36px 0 0;font-size:clamp(18px,2vw,24px);line-height:1.4;font-weight:500;max-width:40ch">The investable media playbook</p>
  </div>

  <div class="cs-meta" style="display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:3px solid #16151B">
    <div style="padding:22px 24px 26px;border-right:2px solid #16151B">
      <div style="font-size:11px;font-weight:700;letter-spacing:.12em;color:#241B6B;margin-bottom:10px">STATUS</div>
      <div style="font-family:'Archivo Black',sans-serif;font-size:22px;text-transform:uppercase;line-height:1.1">Coming soon</div>
    </div>
    <div style="padding:22px 24px 26px;border-right:2px solid #16151B">
      <div style="font-size:11px;font-weight:700;letter-spacing:.12em;color:#241B6B;margin-bottom:10px">PUBLICATION DATE</div>
      <div style="font-family:'Archivo Black',sans-serif;font-size:22px;text-transform:uppercase;line-height:1.1">29 September 2026</div>
    </div>
    <div style="padding:22px 24px 26px">
      <div style="font-size:11px;font-weight:700;letter-spacing:.12em;color:#241B6B;margin-bottom:10px">PUBLISHED BY</div>
      <div style="font-family:'Archivo Black',sans-serif;font-size:22px;text-transform:uppercase;line-height:1.1">Center for Sustainable Media</div>
    </div>
  </div>

  <div style="padding:15px clamp(20px,3vw,40px);background:#16151B;color:#F2F0EA;font-weight:700;font-size:14px;letter-spacing:.04em">{{ countdown }}</div>

  <footer style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:22px clamp(20px,3vw,40px);justify-content:space-between">
    <span style="font-size:12px;font-weight:700;letter-spacing:.08em">© 2026 CENTER FOR SUSTAINABLE MEDIA</span>
    <span style="font-size:12px;font-weight:700;letter-spacing:.08em">FUNDS4MEDIA.ORG</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showCountdown&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const launch = new Date('2026-09-29T00:00:00');
    const days = Math.max(0, Math.ceil((launch - new Date()) / 86400000));
    const show = this.props.showCountdown ?? true;
    const label = days === 0 ? 'PUBLISHED TODAY' : days + (days === 1 ? ' DAY' : ' DAYS') + ' UNTIL PUBLICATION';
    return { countdown: show ? label : 'PUBLICATION · 29 SEPTEMBER 2026' };
  }
}
</script>
</body>
</html>
